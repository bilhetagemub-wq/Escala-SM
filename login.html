<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Escala São Miguel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="tela-login">

<main class="login">

    <section class="login-cartao">
        <div class="login-caixa">

            <img class="login-logo" src="img/logo-sao-miguel.png" alt="São Miguel">

            <h1>Escala de manutenção</h1>
            <p class="login-intro">Entre com o e-mail e a senha cadastrados.</p>

            <form id="loginForm" novalidate>

                <label class="campo" for="email">
                    <span>E-mail</span>
                    <input type="email" id="email" placeholder="nome@empresa.com.br" autocomplete="username" required>
                </label>

                <label class="campo" for="password">
                    <span>Senha</span>
                    <span class="senha">
                        <input type="password" id="password" placeholder="Sua senha" autocomplete="current-password" required>
                        <button type="button" id="togglePassword" class="toggle-password" aria-label="Mostrar ou esconder a senha">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </span>
                </label>

                <div class="login-opcoes">
                    <label class="alternar">
                        <input type="checkbox" id="remember">
                        <span>Lembrar acesso</span>
                    </label>
                    <a href="#" id="forgotPassword">Esqueci minha senha</a>
                </div>

                <button class="bt bt-principal btn-entrar" id="btnLogin" type="submit">
                    <span id="loginText">Entrar</span>
                    <span id="loading" class="loading hidden">
                        <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> Entrando…
                    </span>
                </button>

                <div id="loginMessage" class="message" role="alert" aria-live="polite"></div>
            </form>

            <footer class="login-rodape">© 2026 São Miguel</footer>
        </div>
    </section>

</main>

<script type="module" src="./js/auth.js"></script>

</body>
</html>
